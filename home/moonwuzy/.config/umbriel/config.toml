
# Includes

[include]
files = ["outputs.toml"]

[include.optional]
files = ["cursor.toml"]

# General

[general]
xwayland = true
show_cheatsheet = false
focus_on_activate = true
xwayland_native_resolution = true
nvidia_sync_workaround = true
autostart = [
    "steam -silent",
    "yapfast",
    "vivaldi"
]


# Appearance

[appearance]
border_width = 0
corner_radius = 0
opaque_fullscreen = false

[appearance.blur]
radius = 3
passes = 2

# Input

[input]
middle_click_paste = false

[input.keyboard]
numlock_toggle = true
layout = ""

[input.touchpad]
tap = true

[input.cursor]

# Keybinds

[keybinds]

# Applications and session
"Mod+Return" = { action = "spawn kitty", repeat = false }
"Mod" = "spawn noctalia msg panel-toggle launcher"
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+I" = { action = "spawn ~/.local/bin/nepu", repeat = false }
"Ctrl+Alt+Delete" = { action = "spawn missioncenter", repeat = false }

# Noctalia panels
"Mod+D" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+Y" = { action = "spawn noctalia msg panel-toggle wallpaper", repeat = false }
"Mod+Shift+C" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Mod+U" = { action = "spawn noctalia msg panel-toggle control-center media", repeat = false }
"Mod+Shift+W" = { action = "spawn noctalia msg panel-toggle noctalia/wallhaven:browser", repeat = false }
"Mod+N" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+Shift+V" = { action = "spawn noctalia msg panel-toggle control-center audio", repeat = false }
"Mod+Shift+S" = { action = "spawn noctalia msg panel-toggle mindnbytes/nix-status:details", repeat = false }

# Screenshots
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Print" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }

# Media and brightness
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+F1" = "window-focus-next"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"

# Window state and layout
"Mod+Space" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+Period" = "window-consume-from-right"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+O" = { action = "overview-toggle", repeat = false }

# Workspaces
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"

"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"

# Layout

[layout]
mode = "scrolling"
gap = 22
extent_presets = [0.25, 0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5
center_underfull_strip = true
center_focused = "on_overflow"
center_on_overview_select = false


# Window Rules

[[window_rule]]
blur = true
match.is_alone = true
default_maximize = true

# Startup application workspaces
[[window_rule]]
match.app_id = "^steam$"
default_workspace = 4

[[window_rule]]
match.app_id = "^yapfast$"
default_workspace = 2

[[window_rule]]
match.app_id = "^vivaldi-stable$"
default_workspace = 3

# Noctalia windows
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

# Picture-in-picture
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Notifications
[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Layer Rules

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# Overview

[hot_corners.top_left]
enabled = false
delay_ms = 500
action = "overview-open"

# Colors

[colors.border]
focused = "#7AA3FFFF"

# Outputs

[output.DP-2]
enabled = true
mode = "2560x1440@180"
scale = 1.0
position = [2560, 0]
vrr = "always"
hdr = "off"
sdr_white = 203.0
transform = "normal"
tearing = true
direct_scanout = true
workspaces = "dynamic"

[output.DP-1]
enabled = true
mode = "2560x1440@170"
scale = 1.0
position = [0, 0]
vrr = "always"
hdr = "off"
sdr_white = 203.0
transform = "normal"
tearing = true
direct_scanout = true
workspaces = "dynamic"

# Animations

[animation]
enabled = true
duration_ms = 6

[animation.windows_in]
enabled = true
scale = 0.6
style = "slide"

# Effects

[effects]
in_capture = false
